```yaml
name: Notify Pull Request Reviewer

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  notify-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Notify reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body "🔔 @LEIPL-131638, este Pull Request está pronto para revisão. Por favor, faça o review quando possível."
```
